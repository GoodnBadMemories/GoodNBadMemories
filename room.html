
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoodnBadMemories — Enter the Room</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080706;
  color: #f4e8d8;
  font-family: Arial, sans-serif;
}

#scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #080706;
}

#roomImage {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transform: scale(1);
  transition: transform 1.8s cubic-bezier(.2,.75,.2,1),
              filter 1.8s ease;
  will-change: transform;
}

#shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.48),
    transparent 20%,
    transparent 65%,
    rgba(0,0,0,.3)
  );
}

#brand {
  position: absolute;
  top: 22px;
  left: 25px;
  z-index: 3;
  font-size: 12px;
  letter-spacing: 3px;
}

#brand span {
  display: block;
  margin-top: 8px;
  color: #c98243;
  font-size: 9px;
}

#back {
  position: absolute;
  right: 22px;
  top: 22px;
  z-index: 5;
  padding: 11px 14px;
  border: 1px solid #cbb9a266;
  color: #f4e8d8;
  text-decoration: none;
  background: #08070699;
  font-size: 11px;
  letter-spacing: 1px;
}

.hotspot {
  position: absolute;
  z-index: 2;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  border-radius: 5px;
  transition: border-color .3s, background .3s, box-shadow .3s;
}

.hotspot:hover,
.hotspot:focus-visible {
  border-color: #d68a4a99;
  background: #d68a4a13;
  box-shadow: 0 0 25px #d68a4a22;
  outline: none;
}

#shop {
  left: 4%;
  top: 55%;
  width: 23%;
  height: 7%;
}

#story {
  left: 4%;
  top: 61%;
  width: 23%;
  height: 7%;
}

#contact {
  left: 4%;
  top: 67%;
  width: 23%;
  height: 7%;
}

#new {
  left: 4%;
  top: 73%;
  width: 23%;
  height: 7%;
}

#tv {
  left: 30%;
  top: 20%;
  width: 48%;
  height: 55%;
}

#status {
  position: absolute;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  z-index: 4;
  padding: 12px 18px;
  background: #090807d9;
  border: 1px solid #c9824366;
  color: #e6c4a1;
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
}

#status.visible { opacity: 1; }

#panel {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background: #080706e8;
  opacity: 0;
  visibility: hidden;
  transition: opacity .6s, visibility .6s;
}

#panel.open {
  opacity: 1;
  visibility: visible;
}

#panelContent {
  width: min(480px, 100%);
  text-align: center;
}

#panelEyebrow {
  color: #c98243;
  font-size: 10px;
  letter-spacing: 4px;
}

#panelTitle {
  font-size: clamp(28px, 6vw, 54px);
  margin: 18px 0;
  font-weight: 500;
}

#panelText {
  color: #c6b9ab;
  font-size: 14px;
  line-height: 1.8;
}

#panelButton {
  margin-top: 25px;
  padding: 13px 22px;
  border: 1px solid #c98243;
  color: #f4e8d8;
  background: transparent;
  cursor: pointer;
  letter-spacing: 2px;
  font-size: 10px;
}

#panelButton:hover { background: #c9824322; }

@media (max-width: 600px) {
  #brand { top: 17px; left: 14px; font-size: 10px; }
  #back { top: 14px; right: 12px; font-size: 9px; }
  #shop, #story, #contact, #new {
    left: 3%;
    width: 26%;
  }
  #tv { left: 29%; width: 51%; }
  #status { bottom: 16px; font-size: 8px; }
}
</style>
</head>

<body>
<div id="scene">
  <img
    id="roomImage"
    src="./GoodnBadMemories_%20Nothing%20Stays%20the%20Same-1.png"
    alt="The GoodnBadMemories room"
  >

  <div id="shade"></div>

  <div id="brand">
    GOODNBADMEMORIES
    <span>NOTHING STAYS THE SAME.</span>
  </div>

  <a id="back" href="./index.html">← MAIN WEBSITE</a>

  <button class="hotspot" id="shop" aria-label="Explore Shop" data-room="shop"></button>
  <button class="hotspot" id="story" aria-label="Explore Story" data-room="story"></button>
  <button class="hotspot" id="contact" aria-label="Explore Contact" data-room="contact"></button>
  <button class="hotspot" id="new" aria-label="Explore New Arrivals" data-room="new"></button>
  <button class="hotspot" id="tv" aria-label="Enter the television" data-room="tv"></button>

  <div id="status">ENTERING ANOTHER MEMORY...</div>

  <div id="panel">
    <div id="panelContent">
      <div id="panelEyebrow">GOODNBADMEMORIES · HIDDEN SPACE</div>
      <h1 id="panelTitle">THE NEXT CHAPTER</h1>
      <p id="panelText"></p>
      <button id="panelButton">RETURN TO THE ROOM</button>
    </div>
  </div>
</div>

<script>
const image = document.getElementById("roomImage");
const status = document.getElementById("status");
const panel = document.getElementById("panel");

const destinations = {
  shop: {
    title: "THE COLLECTION",
    text: "Every piece holds a feeling, a chapter, or a moment. This is where the collection will live.",
    zoom: "scale(2.3) translate(-20%, 4%)"
  },
  story: {
    title: "THE MEMORY ROOM",
    text: "Some memories hurt. Some make us smile. All of them become part of who we are.",
    zoom: "scale(2.4) translate(-18%, -8%)"
  },
  contact: {
    title: "LEAVE A MESSAGE",
    text: "Every story starts somewhere. This space will connect you with GoodnBadMemories.",
    zoom: "scale(2.2) translate(-22%, -10%)"
  },
  new: {
    title: "JUST ARRIVED",
    text: "A new chapter is always beginning. Discover the latest pieces from GoodnBadMemories.",
    zoom: "scale(2.5) translate(-18%, 0%)"
  },
  tv: {
    title: "NOTHING STAYS THE SAME",
    text: "The screen flickers. The room goes quiet. Somewhere beyond this picture, another memory is waiting to be discovered.",
    zoom: "scale(3.1) translate(1%, 4%)"
  }
};

document.querySelectorAll("[data-room]").forEach(button => {
  button.addEventListener("click", () => {
    const destination = destinations[button.dataset.room];
    if (!destination) return;

    status.classList.add("visible");
    image.style.transform = destination.zoom;
    image.style.filter = "brightness(.45)";

    window.setTimeout(() => {
      document.getElementById("panelTitle").textContent = destination.title;
      document.getElementById("panelText").textContent = destination.text;
      panel.classList.add("open");
      status.classList.remove("visible");
    }, 1250);
  });
});

document.getElementById("panelButton").addEventListener("click", () => {
  panel.classList.remove("open");
  image.style.transform = "scale(1)";
  image.style.filter = "brightness(1)";
});

image.addEventListener("error", () => {
  document.getElementById("panelTitle").textContent = "IMAGE NOT FOUND";
  document.getElementById("panelText").textContent =
    "Check that the hero image is uploaded beside room.html and that its filename matches the image path in the code.";
  panel.classList.add("open");
});

image.addEventListener("load", () => {
  console.log("GoodnBadMemories room image loaded.");
});
</script>
</body>
</html>
